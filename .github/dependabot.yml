version: 2
updates:
  # Ruby gems (Bundler)
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "Bump"
    ignore:
      - dependency-name: "rails"
        versions: ["< 7.1"]  # Optional: ignore older Rails versions

  # JavaScript / Node (yarn or npm)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "Bump"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "Bump"

