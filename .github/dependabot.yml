version: 2
updates:
  # Ruby gems
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "monthly"  # was daily
      day: "sunday"        # optional - once a month on Sunday
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "rails"          # you can list big deps you prefer to update manually
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
